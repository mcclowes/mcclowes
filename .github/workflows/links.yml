name: Link check

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Weekly, Mondays at 08:00 UTC, to catch links that rot over time
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run lychee link checker
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --accept 200,204,429
            --exclude-path .git
            './**/*.md'
          fail: true
